[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wedding-film"
version = "0.1.0"
description = "Local, inspectable wedding-film production pipeline"
requires-python = ">=3.12"
dependencies = [
  "fonttools>=4.54,<5",
  "pillow>=11,<13",
  "PyYAML>=6.0.2,<7",
]

[project.scripts]
wedding-film = "wedding_film.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<0.13",
  "types-PyYAML>=6.0.12,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["wedding_film"]

[[tool.mypy.overrides]]
module = "fontTools.*"
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/wedding_film"]
